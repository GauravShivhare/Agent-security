[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec"
version = "0.1.0"
description = "AI Agent Security Testing Framework - Break your AI agent before a real attacker does"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "rich>=13.0",
    "docker>=7.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
mcp = [
    "mcp>=1.0",
]
llm = [
    "openai>=1.10",
    "anthropic>=0.20",
]

[project.entry-points."console_scripts"]
agentsec = "agentsec.cli:main"

[project.entry-points."agentsec.adapters"]
custom = "agentsec.adapters.custom:CustomAdapter"

[project.urls]
Homepage = "https://github.com/GauravShivhare/Agent-security"
Repository = "https://github.com/GauravShivhare/Agent-security"
Issues = "https://github.com/GauravShivhare/Agent-security/issues"
Documentation = "https://github.com/GauravShivhare/Agent-security/wiki"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentsec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "SIM", "PTH", "ERA", "PL", "TRY"]
ignore = ["ANN101", "ANN102", "T201", "T203", "S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106", "PLW017"]
"src/agentsec/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
