name: AgentSec Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    name: AgentSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for SARIF upload
      pull-requests: write    # for PR comments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AgentSec
        run: |
          pip install -e .[dev]

      - name: Run AgentSec scan
        id: agentsec
        run: |
          agentsec scan examples/vulnerable_agent --fail-on high --output-json agentsec-report.json || true
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload JSON report artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentsec-report
          path: agentsec-report.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('agentsec-report.json', 'utf8'));
            const summary = report.summary;
            
            let body = `## 🛡️ AgentSec Security Scan Results\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Total Attacks | ${summary.total_attacks} |\n`;
            body += `| Passed | ✅ ${summary.passed} |\n`;
            body += `| Failed | ❌ ${summary.failed} |\n`;
            body += `| Security Score | ${summary.security_score}/100 |\n\n`;
            
            if (summary.failed > 0) {
              body += `### Severity Breakdown\n\n`;
              body += `| Severity | Count |\n|----------|-------|\n`;
              for (const [sev, count] of Object.entries(summary.severity_breakdown)) {
                if (count > 0) {
                  body += `| ${sev.toUpperCase()} | ${count} |\n`;
                }
              }
              body += `\n⚠️ **Scan failed** - vulnerabilities detected above threshold.\n`;
            } else {
              body += `✅ **All checks passed** - no vulnerabilities detected.\n`;
            }
            
            body += `\n[View full report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload SARIF (if available)
        if: ${{ steps.agentsec.outputs.exit_code != '0' && hashFiles('agentsec-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentsec-report.sarif

      - name: Fail job if vulnerabilities found
        if: ${{ steps.agentsec.outputs.exit_code == '1' }}
        run: |
          echo "::error::AgentSec scan found vulnerabilities above threshold"
          exit 1