name: AgentSec Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # SAST: CodeQL Deep Static Analysis
  # ════════════════════════════════════════════════════════════════════════
  codeql:
    name: CodeQL (Python + JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ════════════════════════════════════════════════════════════════════════
  # SAST: Semgrep (Custom Repo Rules + Public Packs)
  # ════════════════════════════════════════════════════════════════════════
  semgrep:
    name: Semgrep (Repo Rules - Hard Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Custom AgentSec rules (blocking on ERROR)
        run: |
          semgrep scan \
            --error \
            --metrics=off \
            --severity=ERROR \
            --sarif --sarif-output=semgrep.sarif \
            --config=.semgrep/agentsec-rules.yml \
            --exclude=node_modules --exclude=.venv --exclude=dist --exclude=build
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ════════════════════════════════════════════════════════════════════════
  # SCA: Trivy (Dependencies + IaC/Docker Config)
  # ════════════════════════════════════════════════════════════════════════
  trivy-fs:
    name: Trivy FS (Dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy Config (Dockerfile/Compose Misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - name: Upload Trivy Config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ════════════════════════════════════════════════════════════════════════
  # Secrets: TruffleHog (Verified Secrets Only)
  # ════════════════════════════════════════════════════════════════════════
  trufflehog:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS (verified secrets)
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --sarif --sarif-output=trufflehog.sarif
      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog

  # ════════════════════════════════════════════════════════════════════════
  # SCA: Dependency Review (PRs)
  # ════════════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe dependency graph availability
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency review skipped::Dependency graph not enabled (Settings → Security → Dependency graph)."
          fi
      - name: Dependency review
        if: steps.depgraph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true

  # ════════════════════════════════════════════════════════════════════════
  # AgentSec Dynamic Security Scan
  # ════════════════════════════════════════════════════════════════════════
  agentsec-scan:
    name: AgentSec Security Scan
    needs: [codeql, semgrep, trivy-fs, trivy-config, trufflehog, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install AgentSec
        run: pip install -e .[dev]

      - name: Run AgentSec scan
        id: agentsec
        run: |
          agentsec scan examples/vulnerable_agent --fail-on high --output-json agentsec-report.json --output-sarif agentsec-report.sarif || true
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload JSON report artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentsec-report
          path: agentsec-report.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('agentsec-report.json', 'utf8'));
            const summary = report.summary;
            
            let body = `## 🛡️ AgentSec Security Scan Results\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Total Attacks | ${summary.total_attacks} |\n`;
            body += `| Passed | ✅ ${summary.passed} |\n`;
            body += `| Failed | ❌ ${summary.failed} |\n`;
            body += `| Security Score | ${summary.security_score}/100 |\n\n`;
            
            if (summary.failed > 0) {
              body += `### Severity Breakdown\n\n`;
              body += `| Severity | Count |\n|----------|-------|\n`;
              for (const [sev, count] of Object.entries(summary.severity_breakdown)) {
                if (count > 0) {
                  body += `| ${sev.toUpperCase()} | ${count} |\n`;
                }
              }
              body += `\n⚠️ **Scan failed** - vulnerabilities detected above threshold.\n`;
            } else {
              body += `✅ **All checks passed** - no vulnerabilities detected.\n`;
            }
            
            body += `\n[View full report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload AgentSec SARIF
        if: always() && hashFiles('agentsec-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentsec-report.sarif
          category: agentsec

      - name: Fail job if vulnerabilities found
        if: ${{ steps.agentsec.outputs.exit_code == '1' }}
        run: |
          echo "::error::AgentSec scan found vulnerabilities above threshold"
          exit 1

  # ════════════════════════════════════════════════════════════════════════
  # Summary: Security Gate
  # ════════════════════════════════════════════════════════════════════════
  security-gate:
    name: Security Gate (All Checks Passed)
    needs: [codeql, semgrep, trivy-fs, trivy-config, trufflehog, dependency-review, agentsec-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: All security checks passed
        run: |
          echo "✅ All security gates passed:"
          echo "  - CodeQL (SAST)"
          echo "  - Semgrep (Custom Rules)"
          echo "  - Trivy (Dependencies + IaC)"
          echo "  - TruffleHog (Secrets)"
          echo "  - Dependency Review"
          echo "  - AgentSec (Dynamic AI Agent Scan)"
          echo ""
          echo "🛡️ Security gate: PASSED"